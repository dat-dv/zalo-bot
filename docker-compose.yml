services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      # Fixed on purpose: changing them after the volume exists leaves the API unable to connect.
      POSTGRES_DB: zalobot
      POSTGRES_USER: zalobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or .env.production}
    volumes:
      - zalobot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - zalobot-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BE_PORT: ${BE_PORT:-3005}
    restart: unless-stopped
    ports:
      - '${BE_PORT:-3005}:${BE_PORT:-3005}'
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      TZ: ${DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
      BE_PORT: ${BE_PORT:-3005}
      # Values below are fixed for this stack (in-compose Postgres without SSL, data volume at
      # /app/data, migrations only) and always win over env_file. Coolify still lists every key here
      # as a locked env it refuses to delete; that is expected.
      DATABASE_URL: postgresql://zalobot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/zalobot
      DATABASE_SSL: 'false'
      REDIS_URL: redis://redis:6379
      TYPEORM_SYNCHRONIZE: 'false'
      DATA_DIR: /app/data
      COGNEE_URL: http://cognee:8000
    volumes:
      - ./data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:${BE_PORT:-3005}/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Long-term chat memory graph (one dataset per chat). Internal only: no published port. The
  # API leaves it unused while COGNEE_USER_PASSWORD is empty. Its own SQLite/LanceDB/Kuzu stores
  # live in the volume, so the main Postgres image stays untouched.
  cognee:
    image: cognee/cognee:1.6.5
    restart: unless-stopped
    environment:
      # Per-dataset isolation: without it Cognee ignores the dataset filter of recall.
      ENABLE_BACKEND_ACCESS_CONTROL: 'true'
      TELEMETRY_DISABLED: 'true'
      # One LLM call per chunk (graph extraction) instead of two.
      SUMMARY_METHOD: from_extraction
      LLM_PROVIDER: ${COGNEE_LLM_PROVIDER:-custom}
      LLM_ENDPOINT: ${COGNEE_LLM_ENDPOINT:-}
      LLM_MODEL: ${COGNEE_LLM_MODEL:-}
      LLM_API_KEY: ${COGNEE_LLM_API_KEY:-}
      # Multilingual embeddings computed inside the container (no key, chat text stays here).
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_DIMENSIONS: '384'
      FASTAPI_USERS_JWT_SECRET: ${COGNEE_JWT_SECRET:-}
      DEFAULT_USER_EMAIL: zalobot@example.com
      DEFAULT_USER_PASSWORD: ${COGNEE_USER_PASSWORD:-}
      # Browser origin of the Cognee UI (CORS); UI and API share that host behind the web nginx.
      UI_APP_URL: https://${COGNEE_UI_HOST:-cognee.localhost}
    volumes:
      - zalobot-cognee:/cognee-storage
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Cognee web UI, served at https://${COGNEE_UI_HOST} by the web nginx together with
  # the Cognee API, so the login cookie and CORS stay on one origin. Internal only.
  cognee-ui:
    image: cognee/cognee-ui:1.6.5
    restart: unless-stopped
    environment:
      # Read by the browser: the public origin, never an internal hostname.
      COGNEE_BACKEND_URL: https://${COGNEE_UI_HOST:-cognee.localhost}

  web:
    build:
      context: .
      # No NEXT_PUBLIC_API_URL build arg: web and API share the domain, so the web calls /api relatively.
      dockerfile: apps/web/Dockerfile
    environment:
      - BE_PORT=${BE_PORT:-3005}
      # Host of the Cognee UI (e.g. cognee.datintech.site); empty = no UI, /cognee answers 404.
      - COGNEE_UI_HOST=${COGNEE_UI_HOST:-}
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-3009}:80'
      # Cognee UI (only answers when COGNEE_UI_HOST is set); Cognee's own login protects it.
      - '${COGNEE_UI_PORT:-3006}:8081'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/ > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  zalobot-postgres:
  zalobot-redis:
  zalobot-cognee:
