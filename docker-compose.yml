services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zalobot}
      POSTGRES_USER: ${POSTGRES_USER:-zalobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or .env.production}
    volumes:
      - zalobot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - zalobot-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BE_PORT: ${BE_PORT:-3005}
    restart: unless-stopped
    ports:
      - '${BE_PORT:-3005}:${BE_PORT:-3005}'
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      BE_PORT: ${BE_PORT:-3005}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zalobot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zalobot}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_URL: redis://redis:6379
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-false}
      DATA_DIR: ${DATA_DIR:-/app/data}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:${BE_PORT:-3005}/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://zalobot.datintech.site}
    environment:
      - BE_PORT=${BE_PORT:-3005}
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-${WEB_PORT:-3009}}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/ > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  zalobot-postgres:
  zalobot-redis:
