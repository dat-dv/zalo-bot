services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zalobot}
      POSTGRES_USER: ${POSTGRES_USER:-zalobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - zalobot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - zalobot-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - zalobot-ollama:/root/.ollama

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-${GATEWAY_PORT:-3000}}:80'
    environment:
      - BE_PORT=${BE_PORT:-3005}
      - FE_PORT=${FE_PORT:-5173}
    volumes:
      - ./docker/nginx/nginx.local.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - postgres
      - redis

volumes:
  zalobot-postgres:
  zalobot-redis:
  zalobot-ollama:
