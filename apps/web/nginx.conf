# WebSocket upgrades pass through; plain requests send no Connection header so the keepalive
# connections of the `api` upstream below are reused instead of opened per request.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' "";
}

upstream api {
  server api:${BE_PORT};
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Prevent Nginx from redirecting with internal port 80
  absolute_redirect off;
  port_in_redirect off;

  # The static export is served uncompressed from disk; gzip it on the way out. Browsers and the
  # CDN in front still cache the hashed /_next/static files for a year (see below).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json text/plain;

  location / {
    # HTML is always revalidated so a deploy reaches installed apps (PWA) on the next load.
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html =404;
  }

  # Exact matches win over the 1-year `\.js$` rule below: a cached worker would never update.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Open pages poll this to notice a deploy; the `\.json$` rule below would cache it for a day.
  location = /version.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /api/ {
    # Static Next.js has no API runtime: Nginx sends every /api/* request to NestJS.
    proxy_pass http://api/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Remote access to the Cognee memory server; written at start by 30-cognee-proxy.sh
  # (404 unless COGNEE_UI_HOST is set).
  include /etc/nginx/cognee.locations;

  location /oauth2callback {
    proxy_pass http://api/oauth2callback;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Build output has content-hashed names, so a deploy never reuses a URL: cache for a year.
  # `^~` stops the regex below from matching these first.
  location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Files from public/ (favicon, PWA icons, og-image) keep their names across deploys:
  # a short cache so a replaced icon shows up within a day.
  location ~* \.(?:css|js|json|svg|png|jpg|jpeg|gif|ico|webp)$ {
    add_header Cache-Control "public, max-age=86400";
  }
}
