server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Prevent Nginx from redirecting with internal port 80
  absolute_redirect off;
  port_in_redirect off;

  location / {
    # HTML is always revalidated so a deploy reaches installed apps (PWA) on the next load.
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html =404;
  }

  # Exact matches win over the 1-year `\.js$` rule below: a cached worker would never update.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /api/ {
    # Static Next.js has no API runtime: Nginx sends every /api/* request to NestJS.
    proxy_pass http://api:${BE_PORT}/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location /oauth2callback {
    proxy_pass http://api:${BE_PORT}/oauth2callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Build output has content-hashed names, so a deploy never reuses a URL: cache for a year.
  # `^~` stops the regex below from matching these first.
  location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Files from public/ (favicon, PWA icons, og-image) keep their names across deploys:
  # a short cache so a replaced icon shows up within a day.
  location ~* \.(?:css|js|json|svg|png|jpg|jpeg|gif|ico|webp)$ {
    add_header Cache-Control "public, max-age=86400";
  }
}
