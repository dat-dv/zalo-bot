<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle with border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Background glow orb -->
  <circle cx="256" cy="180" r="140" fill="url(#glowGrad)" />

  <!-- Logo Mark: Modern T & zalo / Assistant motif -->
  <g filter="url(#subtleGlow)">
    <!-- Top Horizontal Bar of T -->
    <path d="M 136 156 C 136 142.7 146.7 132 160 132 L 352 132 C 365.3 132 376 142.7 376 156 L 376 188 C 376 201.3 365.3 212 352 212 L 160 212 C 146.7 212 136 201.3 136 188 Z" fill="url(#accentGrad)" />

    <!-- Vertical Stem of T with subtle taper -->
    <path d="M 220 200 L 292 200 C 298.6 200 304 205.4 304 212 L 304 356 C 304 369.3 293.3 380 280 380 L 232 380 C 218.7 380 208 369.3 208 356 L 208 212 C 208 205.4 213.4 200 220 200 Z" fill="url(#accentGrad)" />

    <!-- zalo Paper Plane / AI Node Accent floating top-right -->
    <circle cx="376" cy="136" r="20" fill="#38bdf8" />
    <circle cx="376" cy="136" r="12" fill="#ffffff" />

    <!-- Finance Wave / Chart indicator bottom accents -->
    <circle cx="156" cy="380" r="10" fill="#10b981" />
    <circle cx="356" cy="380" r="10" fill="#38bdf8" />
  </g>
</svg>
