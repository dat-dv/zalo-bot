<!doctype html>
<!-- Shown by the service worker when a page was never loaded before and the network is gone.
     Self-contained on purpose: no app scripts or styles are guaranteed to be cached. -->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Đang offline | zalobot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --button: #0f172a;
        --button-text: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090d16;
          --card: #0f172a;
          --border: #1e293b;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --button: #f1f5f9;
          --button-text: #0f172a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--card);
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        margin-top: 16px;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 3px;
        background: var(--button);
        color: var(--button-text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Đang offline</h1>
      <p>Không có kết nối mạng và trang này chưa được lưu trên máy.</p>
      <p lang="en">You are offline and this page has not been saved on this device yet.</p>
      <button type="button" onclick="location.reload()">Thử lại · Retry</button>
    </main>
    <script>
      // Come back by itself as soon as the connection returns.
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
